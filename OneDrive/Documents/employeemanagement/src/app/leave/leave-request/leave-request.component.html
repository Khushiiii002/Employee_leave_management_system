<div class="leave-container">
    <mat-card class="leave-card">
        <mat-card-header>
            <mat-card-title>Request Leave</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="leaveForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Employee</mat-label>
                    <mat-select formControlName="employeeId">
                        <mat-option *ngFor="let emp of employees" [value]="emp.id">
                            {{emp.name}} ({{emp.department}})
                        </mat-option>
                    </mat-select>
                    <mat-error *ngIf="leaveForm.get('employeeId')?.hasError('required')">Employee is
                        required</mat-error>
                </mat-form-field>

                <div class="date-row">
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Start Date</mat-label>
                        <input matInput [matDatepicker]="startPicker" formControlName="startDate">
                        <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
                        <mat-datepicker #startPicker></mat-datepicker>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>End Date</mat-label>
                        <input matInput [matDatepicker]="endPicker" formControlName="endDate">
                        <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
                        <mat-datepicker #endPicker></mat-datepicker>
                    </mat-form-field>
                </div>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Reason / Type</mat-label>
                    <mat-select formControlName="reason">
                        <mat-option *ngFor="let type of leaveTypes" [value]="type">
                            {{type}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="leaveForm.invalid"
                    class="full-width">
                    Submit Request
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
