<div class="dashboard-container">
    <h1 class="mat-h1">HR Dashboard</h1>

    <div class="stats-grid">
        <mat-card class="stat-card employees">
            <mat-card-header>
                <mat-icon mat-card-avatar>people</mat-icon>
                <mat-card-title>Total Employees</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <div class="stat-value">{{ totalEmployees$ | async }}</div>
            </mat-card-content>
        </mat-card>

        <mat-card class="stat-card attendance">
            <mat-card-header>
                <mat-icon mat-card-avatar>check_circle</mat-icon>
                <mat-card-title>Present Today</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <div class="stat-value">{{ presentToday$ | async }}</div>
            </mat-card-content>
        </mat-card>

        <mat-card class="stat-card leaves">
            <mat-card-header>
                <mat-icon mat-card-avatar>pending_actions</mat-icon>
                <mat-card-title>Pending Leaves</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <div class="stat-value">{{ pendingLeaves$ | async }}</div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
