<div class="attendance-container">
    <div class="form-section">
        <mat-card class="attendance-card">
            <mat-card-header>
                <mat-card-title>Mark Attendance</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <form [formGroup]="attendanceForm" (ngSubmit)="onSubmit()">

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Employee</mat-label>
                        <mat-select formControlName="employeeId">
                            <mat-option *ngFor="let emp of employees" [value]="emp.id">
                                {{emp.name}} ({{emp.department}})
                            </mat-option>
                        </mat-select>
                        <mat-error *ngIf="attendanceForm.get('employeeId')?.hasError('required')">Employee is
                            required</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Date</mat-label>
                        <input matInput [matDatepicker]="picker" formControlName="date">
                        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                        <mat-datepicker #picker></mat-datepicker>
                        <mat-error *ngIf="attendanceForm.get('date')?.hasError('required')">Date is required</mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Status</mat-label>
                        <mat-select formControlName="status">
                            <mat-option *ngFor="let status of statuses" [value]="status">
                                {{status}}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>

                    <button mat-raised-button color="primary" type="submit" [disabled]="attendanceForm.invalid"
                        class="full-width">
                        Submit Attendance
                    </button>
                </form>
            </mat-card-content>
        </mat-card>
    </div>

    <div class="list-section">
        <h3>Recent Attendance</h3>
        <!-- Simple list for now, or Mat Table if imported -->
        <div *ngFor="let record of attendanceRecords" class="record-item">
            <span>{{record.date}}</span> -
            <strong>{{getEmployeeName(record.employeeId)}}</strong> -
            <span [class.present]="record.status === 'Present'" [class.absent]="record.status === 'Absent'">
                {{record.status}}
            </span>
        </div>
    </div>
</div>
