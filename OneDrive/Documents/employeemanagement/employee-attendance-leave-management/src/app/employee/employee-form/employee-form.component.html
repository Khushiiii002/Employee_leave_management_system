<div class="form-container">
    <mat-card>
        <mat-card-header>
            <mat-card-title>{{ isEditMode ? 'Edit Employee' : 'Add Employee' }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
            <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()">
                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email">
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Phone</mat-label>
                    <input matInput formControlName="phone">
                </mat-form-field>

                <div class="row">
                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Department</mat-label>
                        <input matInput formControlName="department">
                    </mat-form-field>

                    <mat-form-field appearance="outline" class="half-width">
                        <mat-label>Designation</mat-label>
                        <input matInput formControlName="designation">
                    </mat-form-field>
                </div>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Joining Date</mat-label>
                    <input matInput [matDatepicker]="picker" formControlName="joiningDate">
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-datepicker #picker></mat-datepicker>
                </mat-form-field>

                <button mat-raised-button color="primary" type="submit" [disabled]="employeeForm.invalid">
                    {{ isEditMode ? 'Update' : 'Add' }}
                </button>
            </form>
        </mat-card-content>
    </mat-card>
</div>
