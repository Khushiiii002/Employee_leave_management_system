<mat-toolbar color="primary" class="main-toolbar">
  <button mat-icon-button (click)="sidenav.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>HR Management System</span>
</mat-toolbar>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened class="sidenav">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/employee" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Employees</span>
      </a>
      <a mat-list-item routerLink="/attendance" routerLinkActive="active-link">
        <mat-icon matListItemIcon>event_available</mat-icon>
        <span matListItemTitle>Attendance</span>
      </a>
      <a mat-list-item routerLink="/leave/request" routerLinkActive="active-link">
        <mat-icon matListItemIcon>flight_takeoff</mat-icon>
        <span matListItemTitle>Request Leave</span>
      </a>
      <a mat-list-item routerLink="/leave/approval" routerLinkActive="active-link">
        <mat-icon matListItemIcon>assignment_turned_in</mat-icon>
        <span matListItemTitle>Leave Approvals</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
